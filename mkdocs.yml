site_name: license-server-rust
site_description: >-
  Self-hostable, performance-first software licensing & distribution server
  in Rust — REST + gRPC, multi-DB, Ed25519/ECDSA/RSA/JWT signing.
repo_url: https://github.com/mahavirvataliya/license-server-rust
repo_name: mahavirvataliya/license-server-rust

theme:
  name: material
  palette:
    # auto light/dark to match the admin UI screenshots' aesthetic
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mahavirvataliya/license-server-rust

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

# Internal design/plan documents live under docs/superpowers/ — public repo,
# but not part of the product documentation site.
exclude_docs: |
  superpowers/
