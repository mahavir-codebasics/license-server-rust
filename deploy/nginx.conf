# license-server public site + reverse proxy.
#
#   /          static landing page + docs (from /var/www/site)
#   /v1/,/healthz  -> license-api:8080  (Rust REST API)
#   /admin/    -> license-ui:3000   (Next.js admin console, basePath=/admin)
#
# gRPC (:9090) is published directly by the compose service, not proxied.

worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache hashed static assets (docs CSS is small; cache politely).
  map $sent_http_content_type $cache_ttl {
    default                 10m;
    text/css                1h;
    application/javascript  1h;
    image/svg+xml           1h;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";

  upstream license_api { server license-api:8080; }
  upstream license_ui  { server license-ui:3000; }

  server {
    listen 80 default_server;
    server_name _;

    root /var/www/site;
    index index.html;

    # Static landing page + docs.
    location / {
      try_files $uri $uri/ =404;
      add_header Cache-Control $cache_ttl;
    }

    # REST API.
    location /v1/ {
      proxy_pass http://license_api;
    }

    # Health probe (used by the landing page status badge).
    location = /healthz {
      proxy_pass http://license_api;
      access_log off;
    }

    # Next.js admin console (serves /admin and /admin/_next/...).
    location /admin {
      proxy_pass http://license_ui;
    }
  }
}
