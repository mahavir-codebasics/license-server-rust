# CI for license-server-rust.
#
# Three job groups:
#   1. `lint`     — fmt + clippy (the cheap gates).
#   2. `test`     — workspace unit tests on the matrix {os}. Fast, no DB.
#   3. `db-matrix`— backend contract tests against real Postgres, MySQL,
#                   SQLite via testcontainers. The heart of "multi-db".
#
# The db-matrix job will light up in Phase 1 once the Repository impls exist;
# until then the unit-test job covers us.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install protoc (tonic-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: unit tests (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --all-targets

  db-matrix:
    name: db contract tests (${{ matrix.backend }})
    needs: test
    runs-on: ubuntu-latest
    # Spin up the real database for each backend and run the isolation suite
    # against it. SQLite uses in-memory (no service needed). This is the heart
    # of the "multiple databases" guarantee.
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            test_file: pg_isolation
            db_url: postgresql://license:license@localhost:5432/license
          - backend: mysql
            test_file: mysql_isolation
            db_url: mysql://license:license@localhost:3306/license
          - backend: sqlite
            test_file: isolation
            db_url: "sqlite::memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2

      # Start the database service for this matrix lane.
      - name: Start Postgres
        if: matrix.backend == 'postgres'
        run: |
          docker run -d --name pg -e POSTGRES_USER=license -e POSTGRES_PASSWORD=license \
            -e POSTGRES_DB=license -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U license && break || sleep 1
          done
      - name: Start MySQL
        if: matrix.backend == 'mysql'
        run: |
          docker run -d --name mysql -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=license -e MYSQL_USER=license -e MYSQL_PASSWORD=license \
            -p 3306:3306 mysql:8
          for i in $(seq 1 60); do
            docker exec mysql mysqladmin ping -u license -plicense --silent && break || sleep 1
          done

      - name: Run isolation tests (${{ matrix.backend }})
        env:
          DATABASE_URL: ${{ matrix.db_url }}
        run: cargo test -p license-db --test ${{ matrix.test_file }} -- --include-ignored

  docker-build:
    name: docker image builds
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t license-server:ci .
