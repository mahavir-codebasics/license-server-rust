name: Bug report
description: Report something broken in license-server-rust
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps so we can reproduce it locally.
      placeholder: |
        1. Start the server with ...
        2. Call POST /v1/...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `license-server --version` (or commit SHA if built from source).
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Database backend
      options:
        - sqlite
        - postgres
        - mysql
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Please redact tokens/secrets first.
      render: shell
